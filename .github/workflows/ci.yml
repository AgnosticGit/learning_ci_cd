name: CI
on:
  pull_request:
    branches:
      - testing

jobs: 
  build_ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v2
        with: 
          channel: stable
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build ios --no-codesign

  build_appbundle:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@v2
        with: 
          channel: stable
      - run: flutter pub get
      - run: flutter clean
      - run: flutter build appbundle
      
