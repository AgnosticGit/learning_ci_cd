name: CI

on:
  push:
    branches:
      - main
  
jobs:
  prepare_nekoton:
    runs-on: macos-latest

    steps:
      - name: Get "Homebrew" cache
        id: home_brew_cache
        uses: actions/cache@v3
        with:
          path: /usr/local/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-homebrew-

      - name: Install Homebrew if not cached yet
        if: ${{ steps.home_brew_cache.outputs.cache-hit != 'true' }} 
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Save Homebrew Cache if not cached yet
        if: ${{ steps.home_brew_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3
        with:
          path: /usr/local/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-homebrew- 
      
      - name: Get "LLVM" cache
        id: llvm_cache
        uses: actions/cache@v3
        with:
          path: /usr/runner/opt/llvm
          key: ${{ runner.os }}-llvm-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-llvm-

      - name: Install "LLVM" if not cached yet
        if: ${{ steps.llvm_cache.outputs.cache-hit != 'true' }} 
        run: |
          brew install llvm
          export PATH="/usr/local/opt/llvm/bin:$PATH"

      - name: name
        run: |
          which llvm-config

      - name: Save "LLVM" Cache if not cached yet
        if: ${{ steps.llvm_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3
        with:
          path: /usr/runner/opt/llvm
          key: ${{ runner.os }}-llvm-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-llvm- 
      
      - name: Get "Rust" cache
        id: rust_cache
        uses: actions/cache@v3
        with:
          path: /Users/runner/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-rust-

      - name: Install "Rust" if not cached yet
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' }} 
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"

      - name: Save "Rust" Cache if not cached yet
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3 
        with:
          path: /Users/runner/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-rust- 

