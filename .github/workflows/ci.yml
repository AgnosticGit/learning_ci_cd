name: CI
on:
  push:
    branches:
      - main
      
  build_appbundle:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with: 
          channel: stable
      - run: flutter build appbundle
      
