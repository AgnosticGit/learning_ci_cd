name: CI

on:
  push:
    branches:
      - main
      
jobs:
  prepare_nekoton:
    runs-on: macos-latest

    steps:
      - name: Get "Homebrew" cache
        id: home_brew_cache
        uses: actions/cache@v3
        with:
          path: /usr/local/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-homebrew-

      - name: Install Homebrew if not cached yet
        if: ${{ steps.home_brew_cache.outputs.cache-hit != 'true' }} 
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Save Homebrew Cache if not cached yet
        if: ${{ steps.home_brew_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3
        with:
          path: /usr/local/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-homebrew- 
      
      - name: Get "LLVM" cache
        id: llvm_cache
        uses: actions/cache@v3
        with:
          path: /usr/local/opt/llvm
          key: ${{ runner.os }}-llvm-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-llvm-

      - name: Install "LLVM" if not cached yet
        if: ${{ steps.llvm_cache.outputs.cache-hit != 'true' }} 
        run: |
          brew install llvm

      - name: Save "LLVM" Cache if not cached yet
        if: ${{ steps.llvm_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3
        with:
          path: /usr/local/opt/llvm
          key: ${{ runner.os }}-llvm-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-llvm- 
      
      - name: Get "Rust" cache
        id: rust_cache
        uses: actions/cache@v3
        with:
          path: /Users/runner/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-rust-

      - name: Install "Rust" if not cached yet
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' }} 
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install nightly 

      - name: Save "Rust" Cache if not cached yet
        if: ${{ steps.rust_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3 
        with:
          path: /Users/runner/.cargo
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-rust- 

      - name: Get "nekoton-flutter" cache
        id: nekoton_flutter_cache
        uses: actions/cache@v3
        with:
          path: /Users/runner/work/learning_ci_cd/nekoton-flutter
          key: ${{ runner.os }}-nekoton-flutter-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-nekoton-flutter-

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'oracle'
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with: 
          channel: stable
          flutter-version: '3.7.10'
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
          cache: true

      - name: Checkout "nekoton-flutter"
        if: ${{ steps.nekoton_flutter_cache.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v3
        with:
          path: /Users/runner/work/learning_ci_cd/learning_ci_cd/nekoton-flutter
          repository: broxus/nekoton-flutter
          ref: ecc3beee7053634377f0e12667248c95cd888f24
          
      - name: Build "nekoton-flutter"
        if: ${{ steps.nekoton_flutter_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          cd nekoton-flutter
          flutter pub get
          flutter pub run nekoton_flutter:build

      - name: Save "nekoton-flutter" Cache if not cached yet
        if: ${{ steps.nekoton_flutter_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache@v3
        with:
          path: /Users/runner/work/learning_ci_cd/learning_ci_cd/nekoton-flutter
          key: ${{ runner.os }}-nekoton-flutter-${{ hashFiles('**/Brewfile.lock.json') }}
          restore-keys: ${{ runner.os }}-nekoton-flutter- 
      
      - name: Checkout project
        uses: actions/checkout@v3
        with:
          path: /Users/runner/work/learning_ci_cd/learning_ci_cd/learning_ci_cd

      - name: Build AAB
        run: |
          cd learning_ci_cd
          flutter build appbundle

      - name: Sign AAB
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/bundle/release
          signingKeyBase64: ${{ secrets.UPLOAD_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB to GitHub Actions
        uses: actions/upload-artifact@v2
        with:
          name: Signed app bundle
          path: ${{steps.sign_app.outputs.signedReleaseFile}}
          retention-days: 4

      - name: Create Release AAB
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release V${{ github.run_number }}
          draft: false
          prerelease: false
      
      - name: Upload Release AAB
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{steps.sign_app.outputs.signedReleaseFile}}
          asset_name: app-release-v${{ github.run_number }}.zip
          asset_content_type: application/zip

      - name: Publish to Play Store internal test track
        uses: r0adkll/upload-google-play@v1.0.15
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.dexpaind.qamon
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          inAppUpdatePriority: 3


