name: CI
on: [push]
jobs:
  build:
    runs-on: macOS-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ecc3beee7053634377f0e12667248c95cd888f24 # коммит, на котором должен происходить кэш
      - name: Install Rust, LLVM, NodeJS
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt,rust-src,llvm,nodejs
      - name: Cache Nekoton build dependencies
        uses: actions/cache@v2
        with:
          path: |
            ./nekoton/target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
          key: ${{ runner.os }}-nekoton-build-${{ hashFiles('**/Cargo.lock') }}-${{ env.IMAGE_COMMIT_SHA }}
          restore-keys: |
            ${{ runner.os }}-nekoton-build-${{ hashFiles('**/Cargo.lock') }}-
            ${{ runner.os }}-nekoton-build-
      - name: Build Nekoton for iOS
        run: |
          cd nekoton
          cargo lipo --release --targets=aarch64-apple-ios,armv7-apple-ios,armv7s-apple-ios
          mkdir -p ./target/ios
          cp target/universal/release/libnekoton.a ./target/ios
        env:
          RUSTFLAGS: -C link-arg=-Wl,-dead_strip
      - name: Archive Nekoton build artifacts
        uses: actions/upload-artifact@v2
        with:
          name: nekoton-ios
          path: ./nekoton/target/ios

